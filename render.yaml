services:
  - type: web
    name: ai-rexi-backend
    runtime: node
    rootDir: Backend
    branch: main
    plan: free
    # Build cả Frontend → server.js serve dist/ (nếu không build, trang sẽ trắng)
    buildCommand: npm install && cd ../Frontend && npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/chat/guest-limits
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgresql
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGSSL
        value: "true"
      - key: SESSION_SECRET
        sync: false
      # BẮT BUỘC: auth.middleware THROW khi production không có JWT_SECRET → backend không khởi động được
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Admin seed (thay cho file admin-seed.js chỉ có trên máy local)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
