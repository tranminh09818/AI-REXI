services:
  - type: web
    name: ai-rexi-backend
    runtime: node
    rootDir: Backend
    branch: main
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/chat/guest-limits
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgresql
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGSSL
        value: "true"
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
